<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIYANKES - Sistem Informasi Layanan Kesehatan Evakuasi Pasien</title>
    <meta name="description" content="Sistem Informasi Layanan Kesehatan Evakuasi Pasien - KESDAM XVII/Cenderawasih" />
    <!-- Proteksi Cache: Menjamin URL Terpublikasi Selalu Mengambil Versi Terbaru Saat Direpublish -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta property="og:title" content="SIYANKES - Sistem Informasi Layanan Kesehatan Evakuasi Pasien" />
    <meta property="og:description" content="Sistem Informasi Layanan Kesehatan Evakuasi Pasien - KESDAM XVII/Cenderawasih" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      // Suppress benign Vite dev WebSocket / HMR errors in cloud container preview
      (function() {
        window.addEventListener('error', function(e) {
          if (
            e &&
            (e.message?.includes('WebSocket') ||
             e.message?.includes('createWebSocketModuleRunnerTransport') ||
             e.filename?.includes('@vite/client') ||
             (e.error && String(e.error).includes('WebSocket')))
          ) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          if (
            e &&
            (String(e.reason).includes('WebSocket') ||
             String(e.reason).includes('@vite/client'))
          ) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);

        var OriginalWebSocket = window.WebSocket;
        if (OriginalWebSocket) {
          window.WebSocket = function(url, protocols) {
            var ws = new OriginalWebSocket(url, protocols);
            ws.addEventListener('error', function(event) {
              event.stopPropagation();
            });
            return ws;
          };
          window.WebSocket.prototype = OriginalWebSocket.prototype;
          window.WebSocket.CONNECTING = OriginalWebSocket.CONNECTING;
          window.WebSocket.OPEN = OriginalWebSocket.OPEN;
          window.WebSocket.CLOSING = OriginalWebSocket.CLOSING;
          window.WebSocket.CLOSED = OriginalWebSocket.CLOSED;
        }

        // Proteksi otomatis: Unregister Service Worker usang untuk mencegah stale cache saat republish
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var i = 0; i < registrations.length; i++) {
              registrations[i].unregister();
            }
          }).catch(function() {});
        }

        // Penyelarasan Paksa Lintas Browser & Perangkat (v2.8.0): Hapus cache data lawas agar semua browser (PC, Mobile, Tablet) menampilkan 105 data & UI terbaru saat Republish
        try {
          var targetVersion = '2.8.0';
          if (localStorage.getItem('kesdam_installed_version') !== targetVersion) {
            localStorage.removeItem('kesdam_evacuation_data_v2');
            localStorage.removeItem('kesdam_evacuation_data_v1');
            localStorage.removeItem('kesdam_sync_config_v1');
            localStorage.removeItem('kesdam_preserve_local_edits');
            localStorage.setItem('kesdam_installed_version', targetVersion);
            if ('caches' in window) {
              caches.keys().then(function(names) {
                for (var j = 0; j < names.length; j++) {
                  caches.delete(names[j]);
                }
              }).catch(function() {});
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#0b120c] text-slate-100 min-h-screen font-sans antialiased selection:bg-emerald-500/30 selection:text-emerald-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
